name: iOS local EAS build + TestFlight

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit IPA to App Store Connect / TestFlight
        type: boolean
        default: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build iOS (local, bypasses EAS cloud quota)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NODE_ENV: production
          EXPO_PUBLIC_API_URL: http://85.17.145.134:8787
        run: |
          mkdir -p artifacts
          eas build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output ./artifacts/BlindBoxCloset.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlindBoxCloset-ipa
          path: artifacts/BlindBoxCloset.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Submit to TestFlight
        if: ${{ inputs.submit }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas submit \
            --platform ios \
            --profile production \
            --path ./artifacts/BlindBoxCloset.ipa \
            --non-interactive
