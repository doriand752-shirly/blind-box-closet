name: EAS iOS build + TestFlight (disabled)

# Kept for reference only. Active path is ios-native-build.yml (prebuild + xcodebuild).
# This workflow no longer runs on push.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN to trigger EAS cloud (normally unused)
        required: true
        type: string

jobs:
  build:
    if: ${{ inputs.confirm == 'RUN' }}
    name: Trigger EAS cloud build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
