name: Android APK

# Free GitHub Actions build — no EAS. Produces a sideloadable release APK.

on:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: prebuild + assembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_NO_DOCTOR: "1"
      CI: "1"
      EXPO_PUBLIC_API_URL: http://85.17.145.134:8787
      NODE_ENV: production
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses + install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JS deps
        run: npm ci
        env:
          NODE_ENV: development

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Assemble release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlindBoxCloset-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
