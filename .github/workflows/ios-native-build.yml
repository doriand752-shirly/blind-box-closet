name: iOS native build + TestFlight

# No EAS / Expo Build. Uses expo prebuild + xcodebuild on GitHub-hosted macOS.
# Runner: macos-26 + Xcode 26.6 (best match for Expo SDK 58 / RN 0.88).

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Upload IPA to App Store Connect / TestFlight
        type: boolean
        default: true
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "App.tsx"
      - "index.ts"
      - ".github/workflows/ios-native-build.yml"

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: prebuild + xcodebuild
    runs-on: macos-26
    timeout-minutes: 120
    env:
      APP_DISPLAY_NAME: Blind Box Closet
      BUNDLE_ID: com.blindboxcloset.app
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_NO_DOCTOR: "1"
      CI: "1"
      EXPO_PUBLIC_API_URL: http://85.17.145.134:8787

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS deps
        run: npm ci
        env:
          NODE_ENV: development

      - name: Install ASC API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Resolve Xcode scheme
        id: scheme
        run: |
          set -euo pipefail
          WS=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace=$WS scheme=$SCHEME"
          ls -la ios

      - name: CocoaPods install
        working-directory: ios
        run: |
          pod --version
          pod install

      - name: Archive (App Store)
        env:
          # Metro/babel must see full deps; production NODE_ENV breaks transformFile.
          NODE_ENV: development
        run: |
          set -uo pipefail
          mkdir -p build
          set +e
          xcodebuild archive \
            -workspace "${{ steps.scheme.outputs.workspace }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/BlindBoxCloset.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            "CODE_SIGN_IDENTITY=" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            2>&1 | tee /tmp/xcodebuild-archive.log | xcbeautify --quieter
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Archive failed ($status) — Metro/bundler excerpts:"
            grep -n "Failed to construct transformer\|Cannot find module\|MODULE_NOT_FOUND\|transformFile\|error:" /tmp/xcodebuild-archive.log | tail -n 100 || true
            exit "$status"
          fi

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/BlindBoxCloset.xcarchive" \
            -exportPath "$PWD/build/ipa" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$ASC_KEY_PATH"
          ls -la build/ipa
          IPA=$(ls build/ipa/*.ipa | head -n1)
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          cp "$IPA" build/BlindBoxCloset.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlindBoxCloset-ipa
          path: build/BlindBoxCloset.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'push' || inputs.submit == true }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file build/BlindBoxCloset.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose
